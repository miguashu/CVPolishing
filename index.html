<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD 匹配简历优化器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">JD 匹配简历优化器</div>
    <div class="sub">对标岗位 JD 精准定制 · 量化改写 · 可直接投递</div>
    <nav class="nav">
      <a href="/" class="nav-link active">简历优化</a>
      <a href="/interview" class="nav-link">面试模拟</a>
      <a href="/jd-resume" class="nav-link">JD 生成经历</a>
      <a href="/prompts" class="nav-link">提示词配置</a>
      <a href="/flow" class="nav-link">流程可视化</a>
      <a href="/admin" class="nav-link" id="navAdmin">后台系统</a>
    </nav>
  </header>

  <main class="layout">
    <!-- 左侧：输入 -->
    <section class="panel-input">
      <div class="field">
        <label>目标岗位 JD<span class="req">*</span></label>
        <textarea id="jd" placeholder="粘贴目标岗位的招聘要求，例如：负责某某业务的产品设计，要求 3 年以上经验，熟练使用 Axure、SQL，具备数据分析能力……"></textarea>
      </div>
      <div class="jd-ocr">
        <label>或上传 JD 图片（AI 识别文字）</label>
        <div class="ocr-row">
          <input type="file" id="jdImage" accept="image/*">
          <button id="ocrBtn" class="btn-mini">识别图片</button>
        </div>
        <div id="ocrStatus" class="status-mini"></div>
      </div>
      <div class="field">
        <label>你的简历原文<span class="req">*</span></label>
        <textarea id="resume" placeholder="粘贴你当前的简历全文（支持任意格式，系统会保留原始有效素材后做润色重组）"></textarea>
      </div>
      <div class="options">
        <div class="opt">
          <label for="version">输出版本</label>
          <select id="version">
            <option value="标准优化">标准优化（默认）</option>
            <option value="进阶强化">进阶强化（强化关键词与量化）</option>
            <option value="精简版">精简版（聚焦核心，一页可投递）</option>
          </select>
        </div>
        <div class="opt">
          <label class="checkbox">
            <input type="checkbox" id="searchToggle" checked>
            前置联网检索范文与 HR 标准
          </label>
        </div>
      </div>
      <button id="run" class="btn-primary">开始优化</button>
      <div class="auto-optimize">
        <button id="runAuto" class="btn-primary accent">智能迭代优化（达标 90 分）<span class="vip-flag">VIP</span></button>
        <div class="opt inline">
          <label for="targetScore">目标分</label>
          <input type="number" id="targetScore" value="90" min="60" max="100" step="1" class="num-input">
        </div>
      </div>
      <div id="resumeBanner" class="resume-banner" style="display:none"></div>
      <div id="status" class="status"></div>
    </section>

    <!-- 右侧：输出 -->
    <section class="panel-output">
      <div class="tabs">
        <button class="tab active" data-tab="resume">优化后简历</button>
        <button class="tab" data-tab="notes">优化说明</button>
        <button class="tab" data-tab="refs">参考来源</button>
        <button class="tab" data-tab="score">简历评分</button>
        <button class="tab" data-tab="trace">迭代过程</button>
        <button class="tab" data-tab="bus">Agent 消息流</button>
        <button class="tab" data-tab="skill">Skill 中心</button>
      </div>

      <div class="tabpanel active" id="tab-resume">
        <div class="toolbar">
          <button id="copyResume" class="btn-mini">复制</button>
          <button id="downloadResume" class="btn-mini accent">导出 PDF 简历</button>
          <button id="saveResume" class="btn-mini">保存优化结果</button>
          <button id="gotoInterview" class="btn-mini accent">去面试模拟</button>
        </div>
        <textarea id="resultResume" class="result" placeholder="优化后的简历将显示在这里，可直接编辑修改后复制粘贴到 Word / 记事本投递。"></textarea>
      </div>

      <div class="tabpanel" id="tab-notes">
        <div id="resultNotes" class="notes"></div>
      </div>

      <div class="tabpanel" id="tab-refs">
        <ul id="resultRefs" class="refs"></ul>
      </div>

      <div class="tabpanel" id="tab-score">
        <div class="toolbar">
          <button id="scoreOpt" class="btn-mini accent">评分：优化后简历</button>
          <button id="scoreBoth" class="btn-mini">对比：优化前 vs 后</button>
          <button id="scoreOrig" class="btn-mini">评分：原始简历</button>
          <button id="scoreCompare" class="btn-mini">文字对比：优化前 vs 后</button>
        </div>
        <div id="scoreResult" class="score-result">
          <div class="empty">点击上方按钮，基于 JD 对简历进行多维度评分（JD 匹配度 / 量化成果 / 结构规范 / 经历表现 / 语言表达）。</div>
        </div>
      </div>

      <div class="tabpanel" id="tab-trace">
        <div class="toolbar">
          <button id="refreshTrace" class="btn-mini accent">刷新可视化数据</button>
        </div>
        <div id="traceSummary" class="trace-summary"></div>
        <div id="traceView" class="trace-view">
          <div class="empty">运行「智能迭代优化」后，这里展示每轮评分、思考诊断与监督终裁的量化链路（可联动 LangSmith 链路日志）。</div>
        </div>
      </div>

      <div class="tabpanel" id="tab-bus">
        <div class="toolbar">
          <button id="refreshBus" class="btn-mini accent">刷新可视化数据</button>
        </div>
        <div id="busView" class="bus-view">
          <div class="empty">运行「智能迭代优化」后，这里以对话流形式展示各 Agent 之间的消息传递（谁发给谁、发了什么）。</div>
        </div>
      </div>

      <div class="tabpanel" id="tab-skill">
        <div class="skill-toolbar">
          <input id="skillSearch" class="skill-search" type="text" placeholder="搜索 Skill 名称 / 描述 / 标签…" />
          <div class="skill-filter">
            <button class="chip active" data-filter="all">全部</button>
            <button class="chip" data-filter="installed">我的技能</button>
            <button class="chip" data-filter="market">技能市场</button>
            <button class="chip" data-filter="online">联网技能</button>
          </div>
        </div>
        <div id="skillGrid" class="skill-grid"></div>
        <div id="skillEmpty" class="empty" style="display:none;">没有匹配的 Skill。</div>
      </div>

      <div id="skillModal" class="skill-modal" style="display:none;">
        <div class="skill-modal-mask" onclick="closeSkillModal()"></div>
        <div class="skill-modal-box">
          <button class="skill-modal-close" onclick="closeSkillModal()" aria-label="关闭">×</button>
          <div id="skillModalBody"></div>
        </div>
      </div>

      <div class="progress" id="progress"></div>
    </section>
  </main>

  <script src="/static/user.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/zoom.js"></script>
</body>
</html>
